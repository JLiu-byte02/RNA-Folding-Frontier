name: fresh-clone

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone into a genuinely fresh directory
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rff-fresh"
          cd "$RUNNER_TEMP/rff-fresh"
          test -z "$(git status --porcelain)"
          echo "RFF_FRESH=$PWD" >> "$GITHUB_ENV"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RFF_FRESH"
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26,<2.1" "scipy>=1.11" "pandas>=2.0" \
            "biopython>=1.83" "transformers>=4.44" "safetensors>=0.4" \
            "hydra-core>=1.3" "omegaconf>=2.3" "einops>=0.8" \
            "scikit-learn>=1.4" "matplotlib>=3.8" "tqdm>=4.66" \
            "pyyaml>=6.0" "pytest>=8.0"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"

      - name: Verify every lock against git blob bytes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RFF_FRESH"
          python scripts/verify_lock_basis.py \
            --out "$RUNNER_TEMP/lock_basis_check.json"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "lock_basis_check.json")
          report = json.load(open(path, encoding="utf-8"))
          assert report["all_agree"], report
          assert all(
              f["verdict"] == "both" for f in report["files"]
          ), report
          print(f"{len(report['files'])} locked files agree on worktree and blob bytes")
          PY

      - name: Run the test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$RFF_FRESH"
          python -m pytest -q

      - name: The clone must still be pristine
        shell: bash
        run: |
          set -euo pipefail
          cd "$RFF_FRESH"
          test -z "$(git status --porcelain)"
